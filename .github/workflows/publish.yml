name: Publish npm package
# Re-saved to force GitHub to re-scan this workflow file.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (must match package.json)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      PUBLISH_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.PUBLISH_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Ensure an OIDC-capable npm CLI
        run: npm install --global npm@11
      - run: npm ci
      - name: Validate version and set repository metadata
        run: node scripts/prepare-release.mjs
      - run: npm test
      - run: npm run build
      - run: npm run test:consumer-types
      - name: Pack the tested build
        run: npm pack --ignore-scripts --pack-destination artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: npm-release-${{ env.PUBLISH_TAG }}
          path: artifacts/*.tgz
          if-no-files-found: error
          retention-days: 30
      - name: Publish to npm
        # Prefer a trusted publisher (OIDC). NPM_TOKEN is optional for bootstrapping.
        run: npm publish artifacts/*.tgz --access public --tag "$NPM_DIST_TAG" --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
